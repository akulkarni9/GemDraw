# Production stack for Coolify (or any Docker host).
#
# Deploy this as a single "Docker Compose" resource in Coolify. It builds the
# backend and frontend images and runs Postgres alongside them. Ollama is NOT
# containerized here — it runs natively on the host (e.g. Ollama.app on an Apple
# Silicon Mac, using the Metal GPU). The backend reaches it via the host address
# in OLLAMA_BASE_URL.
#
# IMPORTANT — reaching the host's Ollama depends on your Docker runtime:
#   * Docker Desktop:            http://host.docker.internal:11434
#   * Rancher Desktop / Lima:    http://192.168.5.2:11434  (the VM's host gateway)
#   * Colima:                    http://192.168.5.2:11434  (usually the same)
# The default below targets Rancher Desktop/Lima. Override OLLAMA_BASE_URL for
# other runtimes. Also ensure Ollama is bound to all interfaces on the host:
#   OLLAMA_HOST=0.0.0.0:11434 ollama serve
#
# In Coolify: set the environment variables below, expose the `frontend` service
# on your domain, and let Coolify's proxy terminate HTTPS.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Make host.docker.internal resolve on Linux too (Docker Desktop provides it
    # automatically on macOS/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # asyncpg driver URL built from the Postgres service above.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Reach the host's native Ollama (running Gemma 4 26B on the Mac's GPU).
      # Default targets Rancher Desktop/Lima (192.168.5.2). For Docker Desktop
      # use http://host.docker.internal:11434 instead.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.5.2:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:26b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-16384}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-131072}
      # Comma-separated extra browser origins allowed by CORS (optional — not
      # needed when the frontend proxies /api same-origin via Nginx).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin: Nginx proxies /api to the backend, so the browser never
        # needs to know the backend URL directly.
        VITE_API_BASE: /api
    restart: unless-stopped
    ports:
      - "80"
    depends_on:
      - backend

volumes:
  postgres_data:
